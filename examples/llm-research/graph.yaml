# An example graph: "what actually improves LLM accuracy on reasoning tasks?"
#
# knoten knows nothing about LLMs. Every rule below is declared HERE, as data.
# A different topic declares different rules and runs the same code.
name: llm-research
description: What actually improves LLM accuracy on reasoning tasks?

# These are enforced. A node whose type or status is not on these lists is a typo, and
# a claim with a typo'd status silently drops out of every query.
node_types: [hypothesis, experiment, finding, gate, source]
statuses:   [open, alive, dead, retracted, superseded, active]

# The filter axis. `knoten index --tag decoding` narrows a graph too big to read into a
# slice you can read in one go, so a typo'd tag is a node outside every filtered view.
tags: [decoding, reasoning, prompting, evaluation, gate]

rules:
  - id: live-claims-must-cite-their-gates
    when_status: alive
    when_type: hypothesis
    require_edge: kn:survivedGate
    message: An unchallenged claim is not a finding, it is a hope.

  - id: dead-claims-must-say-why
    when_status: dead, retracted
    require_sections: Why it died, What would reopen this
    message: The post-mortem IS the asset - a dead end must become a standing offer.

  - id: deaths-must-name-a-cause
    when_status: dead, retracted
    require_field_one_of:
      cause: [no_signal, cost_hurdle, structural_blocker, selection_bias,
              weak_baseline, underpowered, crowding_decay]
    message: >
      A cause of death you cannot filter on is a story, not an index. Name it, and
      "re-open everything that died of a weak baseline" becomes one query.

  # THIS graph's own domain rule. The core has no idea what a token budget is.
  - id: claims-must-report-token-budget
    when_type: hypothesis
    require_result: tokens_per_question
    message: >
      An accuracy gain bought with extra inference compute is not a method, it is a
      bigger bill. State the token budget.

  - id: underpowered
    when_type: hypothesis
    require_result_min: {n_independent: 30}
    message: A result on fewer than 30 independent questions is noise, not evidence.
