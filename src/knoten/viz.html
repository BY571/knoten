<!doctype html><meta charset="utf-8"><title>knoten</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
:root{
  --paper:#F8F6F1; --surface:#FFF; --line:#E7E3D9; --line-2:#D5D0C2;
  --ink:#141A33; --ink-2:#5A6285; --ink-3:#9AA0BC;
  --dead:#A63A2E; --alive:#2F6F5E; --active:#3D5AA8; --open:#9A6B1F; --held:#6E5A9E;
  --rel:#C3C7DE; --r:7px;
  /* Six muted outlines for the compressible clusters. Muted on purpose: they sit on top
     of a page that already uses colour for a verdict, and a cluster is a suggestion. */
  --c1:#5B7DB1; --c2:#8A6BA8; --c3:#4E8C74; --c4:#A8823E; --c5:#A4596B; --c6:#5E7C88;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:14px;padding:11px 20px;
  border-bottom:1px solid var(--line);background:var(--surface)}
header svg.mark{width:34px;height:34px;flex:none}
header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.025em;line-height:1}
header .sub{display:block;margin-top:4px;font:600 9px/1 var(--mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3)}
.viewsw{display:flex;gap:2px;background:#EFEBE2;border-radius:9px;padding:3px;flex:none;
  margin-left:18px}
.viewsw button{border:0;background:none;font:600 11.5px var(--sans);color:var(--ink-2);
  padding:5px 12px;border-radius:6px;cursor:pointer}
.viewsw button[aria-pressed=true]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 2px #141a331f}
.viewsw button:focus-visible{outline:2px solid var(--active);outline-offset:1px}
.live{flex:none;font:600 9.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--alive);display:flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--alive);
  animation:pulse 2s ease-in-out infinite}
.live.stale{color:var(--dead);text-transform:none;letter-spacing:.02em}
.live.stale::before{background:var(--dead);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live::before{animation:none}}
.stats{margin-left:auto;display:flex;align-items:baseline;gap:18px;min-width:0}
.tot{flex:none;display:flex;align-items:baseline;gap:6px}
.tot b{font-size:23px;font-weight:640;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tot span{font:600 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.meterwrap{flex:none;width:min(32vw,300px);position:relative;top:2px}
.meter{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--line)}
.meter i{display:block;height:100%}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:7px;font-size:11.5px;color:var(--ink-2)}
.key b{font-variant-numeric:tabular-nums;font-weight:640;color:var(--ink)}
.key i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}
#strip{flex:none;align-self:center;max-width:min(30vw,340px);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font:11.5px var(--mono);color:var(--ink-2)}
#clusters{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;
  font:600 11.5px var(--sans);color:var(--ink-2);padding:6px 12px;cursor:pointer}
#clusters[aria-pressed=true]{border-color:var(--ink);color:var(--ink)}
#clusters:focus-visible{outline:2px solid var(--active);outline-offset:1px}

main{flex:1;display:flex;min-height:0}
#viewport{flex:1;position:relative;overflow:hidden;cursor:grab}
#viewport.drag{cursor:grabbing}
#stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--rel);stroke-width:1.25;opacity:.55;
  transition:stroke .12s,opacity .12s,stroke-width .12s}
#edges path.on{stroke:var(--ink-2);stroke-width:2;opacity:1}
#edges path.off{opacity:.12}
#edges path.back{stroke:var(--ink-3)}
#walls circle{fill:var(--ink);fill-opacity:.028;stroke:var(--ink);stroke-opacity:.09}
#walls circle.cluster{fill:none;stroke-dasharray:4 4;stroke-opacity:.8;stroke-width:1.5}
#walls text{font:600 9.5px var(--mono);text-anchor:middle;letter-spacing:.04em}
/* Folded away, not faded: a covered node is inside its rule until you open it. */
.card.hidden,#dots g.hidden,#edges path.hidden{display:none}
#walls,#dots{display:none}
body.map #walls{display:block}
body.map #dots{display:block;pointer-events:auto}
body.map .card,body.map .colhead{display:none}
#dots text{font:10.5px var(--mono);fill:var(--ink-3);text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:var(--paper);stroke-width:3px}
#dots text.big{font:600 11px var(--sans);fill:var(--ink)}
#dots .halo{fill:var(--ink);opacity:.13}
#dots .ring{fill:none;stroke:var(--ink);stroke-opacity:.35}
#dots g.faded{opacity:.22}
#elabels text{font:600 9px var(--mono);text-anchor:middle;pointer-events:none;
  fill:var(--ink-2);paint-order:stroke;stroke:var(--paper);stroke-width:3px}

.colhead{position:absolute;width:250px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.colhead .t{font-size:13px;font-weight:620;letter-spacing:-.01em}
.colhead .role{display:block;margin-top:2px;font:600 9px var(--mono);letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3)}

/* Two shadows, composed: `--shadow` is the card's state (selected, broken, hovered) and
   `--ring2` is the second cluster a card belongs to. Written as one `box-shadow` each,
   the cluster ring overwrote the selection and the broken outline -- a card in two
   clusters could not be shown as selected. */
.card{position:absolute;width:250px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--edge,var(--line-2));
  border-radius:var(--r);padding:9px 11px 9px 10px;font:inherit;color:inherit;cursor:pointer;
  --shadow:0 1px 1px #15161a08;box-shadow:var(--ring2,0 0 #0000),var(--shadow);
  transition:box-shadow .13s,border-color .13s,transform .13s}
.card:hover{--shadow:0 3px 10px #15161a12;transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--active);outline-offset:2px}
.card.on{border-color:var(--ink);--shadow:0 4px 14px #15161a1f}
.card.faded{opacity:.34}
.card.broken{border-color:var(--dead);--shadow:0 0 0 1px var(--dead) inset}
.card .broke{display:block;margin-top:7px;padding-top:6px;border-top:1px solid var(--line);
  font:600 10px var(--mono);letter-spacing:.03em;color:var(--dead)}
#dots circle.cell.broken{stroke:var(--dead);stroke-width:2.5}
#panel .broke{margin-top:13px;border-left:4px solid var(--dead);background:#FDF6F4;
  border-radius:0 8px 8px 0;padding:10px 13px}
#panel .broke h3{margin:0 0 4px;color:var(--dead)}
#panel .broke p{margin:0 0 6px;font-size:12.5px;color:var(--ink-2)}
.card .ttl{display:-webkit-box;font-size:12.5px;line-height:1.35;font-weight:520;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.closed .ttl{text-decoration:line-through;text-decoration-color:var(--dead);color:var(--ink-2)}
/* A row, not a line: the id sits left and the `covers N` chip right, so a rule card is
   exactly as tall as every other card and the column layout's rows still line up. */
.card .id{display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-top:5px;font:10.5px/1 var(--mono);color:var(--ink-3)}
.card .verdict{float:right;margin-left:8px;font:600 9.5px/1 var(--sans);letter-spacing:.07em;
  text-transform:uppercase;color:var(--edge)}
/* A span, not a button: a button inside the card's button is invalid HTML, and the
   browser that flattens it drops the card's own click. */
.card .covers{flex:none;padding:2px 7px;border-radius:99px;
  background:#F0F0EC;font:600 10px/1.3 var(--mono);letter-spacing:.04em;color:var(--ink-2)}
.card .covers:hover{background:#E6E5DE;color:var(--ink)}
.rail{display:flex;gap:2px;align-items:center;margin-top:8px;padding-top:7px;
  border-top:1px solid var(--line)}
.rail i{width:3px;height:11px;border-radius:1px;background:var(--alive)}
.rail i.x{background:var(--dead);height:7px;align-self:flex-end}
.rail .none{font:11px/1 var(--sans);color:var(--ink-3)}
.rail .cnt{margin-left:auto;font:600 10px/1 var(--mono);color:var(--ink-3);
  font-variant-numeric:tabular-nums}

#panel{width:var(--panelw,390px);flex:none;border-left:1px solid var(--line);
  background:var(--surface);overflow:auto;padding:20px 22px 60px}
#grip{flex:none;width:7px;cursor:col-resize;background:var(--paper);position:relative}
#grip::after{content:"";position:absolute;inset:0 3px;background:var(--line-2);opacity:0;
  transition:opacity .12s}
#grip:hover::after,#grip.dragging::after{opacity:1}
body.resizing{cursor:col-resize;user-select:none}
#panel .eyebrow{font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3)}
#panel h2{margin:9px 0 0;font-size:19px;line-height:1.28;font-weight:620;letter-spacing:-.02em}
.state{margin-top:13px;border-left:4px solid var(--sc,var(--line-2));background:#FBFAF6;
  border-radius:0 8px 8px 0;padding:10px 13px}
.state .s{display:flex;align-items:baseline;gap:8px}
.state .s b{font-size:16px;font-weight:640;letter-spacing:-.015em;color:var(--sc)}
.state .s em{font-style:normal;font:600 9.5px var(--mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3)}
.state p{margin:4px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 10.5px/1 var(--sans);padding:4px 8px;border-radius:99px;background:#F0F0EC;
  color:var(--ink-2)}
h3{margin:20px 0 6px;font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3)}
#panel p{margin:0 0 9px;font-size:13px;line-height:1.6;color:#2E3138;white-space:pre-wrap}
.callout{margin-top:14px;border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  background:#FCFBF8}
.callout h3{margin:0 0 5px}
.callout p{margin:0;font-size:12.5px}
.callout.offer{border-color:#CFC4A6;background:#FDFBF2}
details{margin:0 0 9px}
details>summary{cursor:pointer;list-style:none;font-size:12px;color:var(--ink-2)}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"show more ▸";font:600 10px var(--mono);letter-spacing:.06em;
  color:var(--ink-3)}
details[open]>summary::before{content:"show less ▾"}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
dt{color:var(--ink-3);font-family:var(--mono);font-size:11.5px}
dd{margin:0;font-variant-numeric:tabular-nums}
.relgroup{margin-top:12px}
.relgroup .rh{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
.relgroup .rh b{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;
  color:var(--rc,var(--ink-3))}
.relgroup .rh span{font:10px var(--mono);color:var(--ink-3)}
.link{display:block;width:100%;text-align:left;background:none;border:0;border-radius:5px;
  padding:5px 6px;margin-left:-6px;cursor:pointer;font:12.5px var(--sans);color:var(--ink)}
.link:hover{background:#F2F2EE}
.link:focus-visible{outline:2px solid var(--active);outline-offset:-2px}
.link small{display:block;color:var(--ink-3);font-size:11px}
.link small.mark{color:var(--dead);font:600 10px var(--mono);letter-spacing:.03em}
.blank{margin-top:64px;text-align:center;color:var(--ink-3);font-size:13px}
#panel h3.field{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin:.7em 0 .25em}

#clegend,#klegend,#cllegend{position:absolute;right:16px;bottom:16px;max-width:390px;
  max-height:60%;overflow:auto;
  background:#F8F6F1F2;border:1px solid var(--line);border-radius:9px;padding:11px 13px}
#klegend{display:none} body.map #klegend{display:block} body.map #clegend{display:none}
/* One legend at a time, in the same corner. Turning the clusters on says the corner is
   about clusters now; turning them off gives the column/key legend back. */
#cllegend{display:none}
body.clusters #cllegend{display:block}
body.clusters #clegend,body.clusters #klegend{display:none}
#clegend summary,#klegend summary,#cllegend summary{cursor:pointer;list-style:none;
  font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
#clegend summary::-webkit-details-marker,#klegend summary::-webkit-details-marker,
#cllegend summary::-webkit-details-marker{display:none}
#clegend summary::after,#klegend summary::after,#cllegend summary::after{content:" ▾";
  color:var(--line-2)}
#clegend:not([open]) summary::after,#klegend:not([open]) summary::after,
#cllegend:not([open]) summary::after{content:" ▸"}
#clegend[open] summary,#klegend[open] summary,#cllegend[open] summary{margin-bottom:7px}
.crow{margin-top:7px;border-left:3px solid var(--cc,var(--line-2));padding-left:8px}
.crow .ch{font-size:11.5px;color:var(--ink-2)}
.crow .ch b{color:var(--ink);font-weight:640}
.crow button{border:0;background:none;padding:2px 5px;margin:2px 3px 0 0;border-radius:5px;
  font:11px var(--mono);color:var(--ink-2);cursor:pointer}
.crow button:hover{background:#EFEBE2;color:var(--ink)}
.lrow{display:flex;gap:8px;font-size:11.5px;line-height:1.45;color:var(--ink-2);margin-top:3px}
.lrow b{flex:none;min-width:88px;color:var(--ink);font-weight:640}
#trail{position:absolute;top:12px;left:16px;display:none;align-items:center;gap:6px;
  background:#F8F6F1E8;border:1px solid var(--line);border-radius:8px;padding:5px 9px;
  font:11.5px var(--mono);max-width:calc(100% - 32px);overflow:hidden}
body.map #trail{display:flex}
#trail button{border:0;background:none;font:inherit;color:var(--ink-2);cursor:pointer;
  padding:2px 4px;border-radius:4px;white-space:nowrap}
#trail button:hover{background:#EFEBE2;color:var(--ink)}
#trail button:last-of-type{color:var(--ink);font-weight:600}
#trail .sep,#trail .hint{color:var(--ink-3)}
footer{position:absolute;bottom:12px;left:16px;font-size:11.5px;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id=app>
  <header>
    <svg class=mark viewBox="0 0 48 48" aria-hidden=true>
      <g stroke="#141A33" stroke-width="2.1" fill="none" stroke-linecap="round">
        <path d="M24 24 L10 13 M24 24 L38 12 M24 24 L40 27 M24 24 L13 37 M24 24 L27 41"/>
      </g>
      <g fill="#8A93C4">
        <circle cx="10" cy="13" r="3.4"/><circle cx="40" cy="27" r="3.1"/>
        <circle cx="27" cy="41" r="2.6"/>
      </g>
      <g fill="#141A33">
        <circle cx="24" cy="24" r="6"/><circle cx="38" cy="12" r="3.4"/>
        <circle cx="13" cy="37" r="3"/>
      </g>
    </svg>
    <div><h1>knoten</h1><span class=sub id=graphname></span></div>
    <div class=viewsw role=group aria-label="View">
      <button id=v-columns aria-pressed=true>columns</button>
      <button id=v-map aria-pressed=false>map</button>
    </div>
    <div class=viewsw role=group aria-label="Fold" id=foldsw>
      <button id=f-folded aria-pressed=true>folded</button>
      <button id=f-all aria-pressed=false>all</button>
    </div>
    <button id=clusters aria-pressed=false>compressible</button>
    <div class=stats>
      <div class=tot><b id=ntot></b><span>nodes</span></div>
      <div class=meterwrap><div class=meter id=meter></div><div class=key id=key></div></div>
      <div id=strip></div>
    </div>
  </header>
  <main>
    <div id=viewport>
      <div id=stage><svg id=edges><g id=walls></g><g id=links></g><g id=elabels></g>
        <g id=dots></g></svg></div>
      <div id=trail></div>
      <details id=clegend></details>
      <details id=cllegend></details>
      <details id=klegend>
        <summary>legend</summary>
        <div class=lrow><svg width=30 height=8><line x1=1 y1=4 x2=29 y2=4
          stroke="#5A6285" stroke-width=1.5></line></svg>
          <span><b style="width:auto">judged</b> — a gate ruled on it</span></div>
        <div class=lrow><svg width=30 height=8><line x1=1 y1=4 x2=29 y2=4
          stroke="#9AA0BC" stroke-width=1.5 stroke-dasharray="2 4"></line></svg>
          <span><b style="width:auto">related</b> — everything else</span></div>
      </details>
      <footer>drag to pan · wheel to zoom · <b>f</b> fit · <b>v</b> switch · <b>a</b> fold ·
        <b>c</b> clusters · <b>o</b> open a rule · <b>esc</b> clear</footer>
    </div>
    <div id=grip title="drag to resize · double-click to reset"></div>
    <aside id=panel><div class=blank>Select a node to read its record.</div></aside>
  </main>
</div>

<script>
const DATA = __KNOTEN_DATA__;

// The scaffold the record panel rewrites a node into. Matched against the agent's own
// section titles (its aliases), rendered under this label in this fixed order. Kept here
// rather than duplicated from Python so there is one list, in the wire, that the panel
// reads.
const PANEL_SECTIONS = __PANEL_SECTIONS__;

const VC = {alive:"var(--alive)", dead:"var(--dead)", active:"var(--active)",
            open:"var(--open)", retracted:"var(--held)", superseded:"var(--held)",
            blocked:"var(--open)"};
const RC = {"kn:survivedGate":"var(--alive)","kn:killedByGate":"var(--dead)",
            "mp:supports":"var(--active)","mp:challenges":"var(--open)",
            "kn:tests":"var(--held)","npx:supersedes":"#B4508A","npx:retracts":"#B4508A",
            "kn:blockedBy":"var(--open)"};
// A claim nothing can reopen. Everything else still has somewhere to go.
const CLOSED = ["dead", "retracted", "superseded"];
const GATE_RELS = ["kn:survivedGate", "kn:killedByGate"];
// The column step, from the layout that wrote the positions: a hung card takes exactly
// one row, so the two sides have to agree on how tall a row is.
const CARDH = 74, CARDW = 250, COLW = 300, GAP = 12;

document.title = "knoten · " + DATA.root;
document.getElementById("graphname").textContent = DATA.root;
const byId = {}; DATA.nodes.forEach(n => byId[n.id] = n);
if (!DATA.nodes.length){
  // Math.min() of nothing is Infinity, which renders a silently blank page. Say so.
  document.getElementById("panel").textContent = "";
  document.getElementById("panel").append(Object.assign(document.createElement("div"),
    {className:"blank", textContent:"This graph has no nodes yet. `knoten new` writes one."}));
}
const vc = n => VC[n.status] || "var(--line-2)";
const el = (t, c, txt) => { const e = document.createElement(t);
  if (c) e.className = c; if (txt !== undefined) e.textContent = txt; return e; };
const NS = "http://www.w3.org/2000/svg";
const mk = (t, a) => { const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

const stage = document.getElementById("stage"), svg = document.getElementById("edges");
const vp = document.getElementById("viewport"), panel = document.getElementById("panel");
const dots = document.getElementById("dots"), elabels = document.getElementById("elabels");

const degree = {}; DATA.nodes.forEach(n => degree[n.id] = n.links.length + n.backlinks.length);
const degs = DATA.nodes.map(n => degree[n.id]);
const DMIN = Math.min(...degs), DMAX = Math.max(...degs);
// The map is monochrome: shade says how connected a knoten is, which is a property of the
// map. What happened to a claim is a property of the claim, and belongs in the record.
function shade(id){
  const t = DMAX > DMIN ? (degree[id] - DMIN) / (DMAX - DMIN) : .5;
  const a = [206,210,223], b = [24,30,58], e = Math.pow(t, .7);
  return `rgb(${a.map((v,i) => Math.round(v + (b[i]-v)*e)).join(",")})`;
}
const short = id => { const t = (byId[id].type || "") + "-";
  return id.startsWith(t) ? id.slice(t.length) : id; };

// ---------------- columns ----------------
const counts = {}; DATA.nodes.forEach(n => counts[n.type] = (counts[n.type]||0) + 1);
DATA.columns.forEach((c, i) => {
  const h = el("div", "colhead");
  h.style.left = i * COLW + "px"; h.style.top = "8px";
  // No count here. It is the number of nodes in the column, and it was misread as an
  // ordinal twice — "hypothesis 3" in a ROW of columns parses as "the third one" before
  // it parses as "three of them", and no amount of padding or placement fixes that. The
  // legend carries the counts, where nothing sequential surrounds them.
  h.append(el("span", "t", c));
  // Only gates get a role label. "cited" was also shown for shelf types, which put
  // CITED under `question` — true, since sources cite it and it cites nothing, and
  // useless, because of course the root question is cited. A gate standing outside the
  // loop is the one thing here you cannot infer from the column's position.
  if (DATA.gate_types.includes(c)) h.append(el("span", "role", "every claim must pass"));
  stage.append(h);
});

// ---------------- drawing ----------------
let VIEW = "columns", sel = null;

let FOLD = true, CLUSTERS = false;
const open = new Set();

// Every rule's hung rows, once per frame. For each rule: which row each hung card takes
// (leaving room for the subtree of an opened rule in front of it), which slot it has on
// the map's spiral, and how many rows the whole open subtree costs. Rebuilt per card this
// walked `covers` again for every card it had already walked.
//
// `seen` is the cycle guard, and it is not hypothetical: two alive nodes superseding each
// other pass `validate` today, and each is then `under` the other. A walk that follows
// `under` without one recurses until the stack gives out — a blank page, from a graph the
// tools called legal.
let ROWS = {}, SIZE = {};
function rowmap(){
  const rows = {}, size = {};
  const walk = (r, seen) => {
    if (size[r.id] !== undefined) return size[r.id];
    if (seen.has(r.id)) return 0;                    // a supersedes cycle: costs no rows
    seen.add(r.id);
    const at = {};
    let row = 1, i = 0;
    for (const c of hung(r)){
      at[c] = {row, i: ++i};
      row += 1 + (open.has(c) && byId[c] ? walk(byId[c], seen) : 0);
    }
    rows[r.id] = at;
    return size[r.id] = row - 1;
  };
  for (const n of DATA.nodes) if (n.rule) walk(n, new Set());
  return {rows, size};
}

// What the page draws. Folded, a covered node is inside its rule until you open it — and
// inside a rule that is itself covered and shut, it stays shut. Two nodes covering each
// other are inside each other: neither is ever a card you can start from, so neither is
// drawn folded, and `all` is how you read a graph in that state.
function visible(id, seen){
  const n = byId[id];
  if (!FOLD || n.under == null) return true;
  seen = seen || new Set();
  if (seen.has(id)) return false;
  seen.add(id);

// Where a node sits, in the current view. Covered nodes have no position of their own in
// the payload — a hung card is derived from its rule's, so opening one is a local reflow
// and appending a node still moves nothing. A node already on the walk falls back to its
// own position rather than hanging off itself.
function posOf(n, seen){
  if (!FOLD) return VIEW === "map" ? n.map : n.columns;
  if (n.under == null) return DATA.folded[n.id][VIEW];
  seen = seen || new Set();
  if (seen.has(n.id)) return VIEW === "map" ? n.map : n.columns;
  seen.add(n.id);
  const r = byId[n.under], at = posOf(r, seen), slot = (ROWS[r.id] || {})[n.id];
  if (VIEW === "map"){
    // The same golden-angle spiral the layout itself uses, at a tighter spacing: index k
    // always lands in the same place, so opening a rule cannot shuffle its siblings.
    const k = slot ? slot.i : 1, rad = HUNG * Math.sqrt(k);
    return [at[0] + rad * Math.cos(k * GOLDEN), at[1] + rad * Math.sin(k * GOLDEN)];
  }
  return [at[0] + HUNGX, at[1] + (CARDH + GAP) * (slot ? slot.row : 1)];
}
const GOLDEN = Math.PI * (3 - Math.sqrt(5)), HUNG = 18, HUNGX = 18;

// Every visible node's position this frame, computed once so the cards, the edges, the
// cluster circles and the viewBox cannot disagree. Copies: `posOf` may hand back an array
// that lives in the payload, and the column reflow below writes into these.
function positions(){
  const rm = rowmap(); ROWS = rm.rows; SIZE = rm.size;
  const P = {};
  for (const n of DATA.nodes) if (visible(n.id)) P[n.id] = posOf(n).slice();
  if (VIEW === "map" || !FOLD) return P;
  // Columns: a hung card takes a row that was not there a click ago, so everything below
  // it in that column moves down, and its own hung cards move with it.
  const family = {}, cols = {};
  for (const n of DATA.nodes){
    if (!visible(n.id)) continue;
    if (n.under == null){ (cols[P[n.id][0]] ||= []).push(n); continue; }
    // Up to the card this one is hanging off, stopping at a node already walked: the
    // same cycle guard, and without it a mutual pair loops here for ever.
    let r = n, seen = new Set();
    while (r.under != null && !seen.has(r.id)){ seen.add(r.id); r = byId[r.under]; }
    (family[r.id] ||= []).push(n.id);
  }
  for (const x in cols){
    let extra = 0;
    for (const n of cols[x].sort((a, b) => P[a.id][1] - P[b.id][1])){
      for (const id of [n.id, ...(family[n.id] || [])]) P[id][1] += extra;
      if (open.has(n.id)) extra += (CARDH + GAP) * (SIZE[n.id] || 0);

function place(){

    dotOf[n.id].g.classList.toggle("hidden", !on);
    cardOf[n.id].classList.toggle("hidden", !on);
    if (chipOf[n.id]){
      chipOf[n.id].textContent = `covers ${hung(n).length} ${open.has(n.id) ? "▾" : "▸"}`;

      cardOf[n.id].setAttribute("aria-expanded", open.has(n.id));

    if (on) dotOf[n.id].g.setAttribute("transform", `translate(${P[n.id][0]},${P[n.id][1]})`);
  }
  for (const p of paths){
    // An edge to a node that is folded away has one end nowhere. Drawn from the rule it
    // would be a line the graph does not contain.
    const both = !!P[p.dataset.a] && !!P[p.dataset.b];
    p.classList.toggle("hidden", !both);
    if (!both) continue;
    const a = P[p.dataset.a], b = P[p.dataset.b];

      const mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
      const dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx,dy) || 1;
      const bow = Math.min(38, L*.13);

      p.classList.remove("back");

      // hypotheses) took the forward branch and swept out and back across it.

      const ax = a[0] + (back ? 0 : CARDW), bx = b[0] + (back ? CARDW : 0);

  const h = Math.max(...ys) - Math.min(...ys) + (map ? 2*pad : CARDH + 2*pad);
  svg.setAttribute("viewBox", `${x0} ${y0} ${w} ${h}`);
  svg.setAttribute("width", w); svg.setAttribute("height", h);
  stage.style.width = w + "px"; stage.style.height = h + "px";
  for (const id of ids){
    const c = cardOf[id];
    c.style.left = (P[id][0] - x0) + "px"; c.style.top = (P[id][1] - y0) + "px";
  }

    h.style.left = (i * COLW - x0) + "px";
    h.style.top = (8 - y0) + "px";
  });

  const wl = FOLD ? DATA.folded_walls : DATA.walls;
  for (const c in wl){ const [x, y, r] = wl[c]; walls.append(mk("circle", {cx:x, cy:y, r})); }

// ---------------- what a rule covers, and what is still loose ----------------
function toggle(id){

function setFold(f){

const CPAL = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)"];

// The clusters `knoten frontier` would print, drawn where they sit. Cheap and dumb on

function drawClusters(P){

    delete cardOf[n.id].dataset.cluster;
  }
  if (!CLUSTERS) return;
  const centres = [];
  (DATA.clusters || []).forEach((c, i) => {
    const ids = c.ids.filter(id => P[id]);
    if (!ids.length) return;           // every member is folded away: nothing to circle
    const col = CPAL[i % CPAL.length];
    for (const id of ids){
      // A card is usually in more than one cluster — the same findings share a gate AND
      // a tag. Overwriting the outline said it was in one, and which one depended on the
      // order the payload happened to list them in. It keeps every index it is in; the

  const said = [], by = r => n.links.filter(l => l.rel === r).map(l => l.to);
  const at = r => n.backlinks.filter(b => b.rel === r).map(b => b.to);

  if (at("npx:retractedBy").length) said.push("retracted by " + at("npx:retractedBy").join(", "));

  //    under the canonical label.
  for (const p of PANEL_SECTIONS){
    const s = n.sections.find(x => !seen.has(x.title) && p.aliases.includes(x.title)
                                    && x.text);
    if (!s) continue;
    seen.add(s.title);
    panel.append(el("h3", "field", p.label));
    panel.append(el("p", null, s.text));
  }
  // 2. The two payoffs, matched by prefix so the finding's merged "Why it died / why it
  //    held" heading still lands here and renders under the canonical label.
  for (const title of CALLOUT){
    const s = n.sections.find(x => !seen.has(x.title) && x.title.startsWith(title)
                                    && x.text);
    if (!s) continue;
    seen.add(s.title);
    const c = el("div", "callout" + (title === CALLOUT[1] ? " offer" : ""));
    c.append(el("h3", null, title), el("p", null, s.text));
    panel.append(c);
  }
  // 3. Any prose the author wrote that matched no scaffold field. Kept, in document
  //    order, so nothing is ever lost - only reorganised.
  for (const s of n.sections){
    if (!s.text || seen.has(s.title) || CALLOUT.includes(s.title)) continue;
    panel.append(el("h3", null, s.title));
    panel.append(el("p", null, s.text));
  }
  facts("results", n.results); facts("repro", n.repro);
  if (n.attachments.length) facts("attachments", Object.fromEntries(n.attachments.map(a => [a, ""])));
  // Before `cites`: what a rule retired is the first thing to know about it, and it is
  // otherwise buried among its own citations. The heading counts what the page actually
  // hangs; every claimed id is listed, and the ones outside the fold say why.
  const covers = opens(n);
  if (covers) relations(`covers ${hung(n).length}`,
                        n.covers.map(to => ({rel:"npx:supersedes", to})), notHung(n));
  // Those same edges under `cites` too would read as a second, longer set of targets.
  relations("cites", covers ? n.links.filter(l => l.rel !== "npx:supersedes") : n.links);
  relations("cited by", n.backlinks);
  if (VIEW === "map"){
    const i = trail.indexOf(id);
    trail = i >= 0 ? trail.slice(0, i + 1) : [...trail, id];
    drawTrail();
  }
  paint();
}
function focus(id){ const keep = sel; sel = id || keep; paint(); sel = keep; }

// ---------------- trail ----------------
let trail = [];
function drawTrail(){
  const t = document.getElementById("trail"); t.textContent = "";
  trail.forEach((id, i) => {
    if (i) t.append(el("span", "sep", "›"));
    const b = el("button", null, id);
    b.onclick = () => { trail = trail.slice(0, i); select(id); };
    t.append(b);
  });
  t.append(el("span", "hint", trail.length ? "— click a neighbour to walk"
                                           : "click a knoten to start walking"));
}

// ---------------- legend: what each column holds, in the graph's own words -------
{
  const leg = document.getElementById("clegend");
  const sum = el("summary", null, "columns");
  leg.append(sum);

  const vocab = DATA.graph.vocab || {};
  const rules = DATA.graph.rules || [];
  const csv = v => String(v || "").split(",").map(x => x.trim()).filter(Boolean);
  for (const c of DATA.columns){
    let says = vocab[c];
    if (!says && DATA.gate_types.includes(c)) says = "the bar others are judged against";
    if (!says){
      const demands = rules.filter(r => csv(r.when_type).includes(c)).map(r =>
        (r.when_status ? `when ${csv(r.when_status).join("/")}, ` : "") +
        (r.require_edge ? `cites ${r.require_edge}` :
         r.require_field ? `records ${r.require_field}` :
         r.require_sections ? `states ${csv(r.require_sections).join(" + ")}` : ""))
        .filter(x => x && !x.endsWith(", "));
      says = demands[0] || "no meaning declared in node_types";
    }
    const row = el("div", "lrow");
    row.append(el("b", null, `${c} · ${counts[c]||0}`), el("span", null, says));
    leg.append(row);
  }
}

// ---------------- the strip: the same sentence `knoten frontier` opens with ----------
// Word for word, from the same numbers. A page that says "2 rules" where the CLI says
// "2 rules over 9 specifics" is a second opinion, and two opinions is one too many.
{
  const s = DATA.shape || {rules:0, specifics:0, budget:[]};
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const budget = b => b.free < 0
    ? `${-b.free} over the ${b.count} budget under ${b.question}`
    : `${b.free} of ${b.count} slots free under ${b.question}`;
  const head = [`${plural(s.rules, "rule")} over ${plural(s.specifics, "specific")}`];
  if (s.clusters) head.push(plural(s.clusters, "compressible cluster"));
  const rows = (s.budget || []).map(budget);
  // The three tightest rows, which is what `render_frontier` prints — `budget` is sorted
  // by how little room is left. The rest are in the tooltip, because a header that wraps
  // is a header nobody reads.
  head.push(...rows.slice(0, 3));
  const strip = document.getElementById("strip");
  strip.textContent = head.join(" · ");
  strip.title = rows.join("\n");
}

// ---------------- the clusters legend: what the outlines mean ----------------
{
  const leg = document.getElementById("cllegend");
  leg.append(el("summary", null, "compressible"));
  const cl = DATA.clusters || [];
  if (!cl.length) leg.append(el("div", "crow", "nothing clusters yet — three alive under one "
                                             + "question sharing a gate or a tag makes one"));
  cl.forEach((c, i) => {
    const row = el("div", "crow");
    row.style.setProperty("--cc", CPAL[i % CPAL.length]);
    const h = el("div", "ch");
    h.append(el("b", null, `#${i} ${c.question}`),
             document.createTextNode(` · ${shared(c)} · ${c.ids.length}`));
    row.append(h);
    // Which clusters this one is the same nodes as. Two clusters over one set of cards
    // is the common case, not an edge case, and the outline can only show two.
    const also = cl.map((o, j) => [j, o.ids.filter(id => c.ids.includes(id)).length])
                   .filter(([j, n]) => j !== i && n);
    if (also.length)
      row.append(el("div", "ch", also.map(([j, n]) =>
        `(shares ${n} card${n === 1 ? "" : "s"} with cluster ${j})`).join(" · ")));
    for (const id of c.ids){
      const b = el("button", null, id);
      b.onclick = () => select(id);
      row.append(b);
    }
    leg.append(row);
  });
}

// Both legends are reference, not chrome: shut by default, and the choice is remembered
// so `--watch` does not reopen them under you every couple of seconds.
for (const id of ["clegend", "klegend", "cllegend"]){
  const d = document.getElementById(id), KEY = "knoten:" + id;
  d.open = sessionStorage.getItem(KEY) === "open";
  d.addEventListener("toggle", () => sessionStorage.setItem(KEY, d.open ? "open" : "shut"));
}

{
  const count = s => DATA.nodes.filter(n => n.status === s).length;
  const stats = [...new Set(DATA.nodes.map(n => n.status))].sort((a,b) => count(b)-count(a));
  document.getElementById("ntot").textContent = DATA.count;
  const meter = document.getElementById("meter"), key = document.getElementById("key");
  for (const s of stats){
    const seg = el("i"); seg.style.background = VC[s] || "var(--line-2)";
    seg.style.flex = count(s); seg.title = `${count(s)} ${s}`; meter.append(seg);
    const k = el("span"); const dot = el("i"); dot.style.background = VC[s] || "var(--line-2)";
    k.append(dot, el("b", null, String(count(s))), document.createTextNode(" " + s));
    key.append(k);
  }
}

// ---------------- a record you can widen ----------------
// Some post-mortems are a page of prose and a results table. Remembered across reloads
// for the same reason the legend is: `--watch` must not undo what you just set.
{
  const grip = document.getElementById("grip"), KEY = "knoten:panelw", DEFAULT = 390;
  const clamp = w => Math.max(300, Math.min(w, innerWidth - 320));
  const setW = w => document.documentElement.style.setProperty("--panelw", clamp(w) + "px");
  const saved = parseFloat(sessionStorage.getItem(KEY) || "");
  if (saved) setW(saved);

  let from = null;
  grip.addEventListener("mousedown", e => {
    from = {x: e.clientX, w: panel.getBoundingClientRect().width};
    grip.classList.add("dragging"); document.body.classList.add("resizing");
    e.preventDefault();
  });
  addEventListener("mousemove", e => { if (from) setW(from.w + (from.x - e.clientX)); });
  addEventListener("mouseup", () => {
    if (!from) return;
    from = null; grip.classList.remove("dragging"); document.body.classList.remove("resizing");
    sessionStorage.setItem(KEY, panel.getBoundingClientRect().width);
  });
  grip.addEventListener("dblclick", () => {
    setW(DEFAULT); sessionStorage.setItem(KEY, DEFAULT);
  });
}

// ---------------- pan, zoom, view ----------------
let view = {x:0, y:0, k:1}, drag = null;
const apply = () => stage.style.transform =
  `translate(${view.x}px,${view.y}px) scale(${view.k})`;
function fit(){
  if (!DATA.nodes.length) return;
  const r = vp.getBoundingClientRect(), pad = 44;
  const w = parseFloat(stage.style.width), h = parseFloat(stage.style.height);
  view.k = Math.min((r.width - 2*pad)/w, (r.height - 2*pad)/h, 1);
  view.x = (r.width - w*view.k)/2; view.y = (r.height - h*view.k)/2;
  apply();
}
vp.onmousedown = e => { if (e.target.closest(".card")) return;
  drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y}; vp.classList.add("drag"); };
addEventListener("mousemove", e => { if (!drag) return;
  view.x = drag.vx + e.clientX - drag.x; view.y = drag.vy + e.clientY - drag.y; apply(); });
addEventListener("mouseup", () => { drag = null; vp.classList.remove("drag"); });
vp.addEventListener("wheel", e => { e.preventDefault();
  const r = vp.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.min(2.4, Math.max(.12, view.k * Math.exp(-e.deltaY * .0015)));
  view.x = mx - (mx-view.x)*(k/view.k); view.y = my - (my-view.y)*(k/view.k);
  view.k = k; apply(); }, {passive:false});
function setView(v){
  VIEW = v; document.body.classList.toggle("map", v === "map");
  document.getElementById("v-columns").setAttribute("aria-pressed", v === "columns");
  document.getElementById("v-map").setAttribute("aria-pressed", v === "map");
  place(); fit();
}
document.getElementById("v-columns").onclick = () => setView("columns");
document.getElementById("v-map").onclick = () => setView("map");
document.getElementById("f-folded").onclick = () => setFold(true);
document.getElementById("f-all").onclick = () => setFold(false);
document.getElementById("clusters").onclick = () => setClusters(!CLUSTERS);
addEventListener("keydown", e => {
  // ctrl+F is the browser's find, cmd+A selects the page, alt+v opens a menu. A page that
  // reads the letter and ignores the modifier answers a shortcut nobody aimed at it.
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "f") fit();
  if (e.key === "v") setView(VIEW === "columns" ? "map" : "columns");
  if (e.key === "a") setFold(!FOLD);
  if (e.key === "c") setClusters(!CLUSTERS);
  // The chip is a pointer target; this is the same fold from the keyboard, on whatever
  // rule the record is currently showing.
  if (e.key === "o" && sel && cardOf[sel] && cardOf[sel].dataset.toggle) toggle(sel);
  if (e.key === "Escape"){ sel = null; paint();
    panel.textContent = ""; panel.append(el("div", "blank", "Select a node to read its record.")); }
});
addEventListener("resize", fit);

drawTrail(); place(); fit();

/*__WATCH__*/
// ---------------- --watch: reload, but do not throw the reader out of their seat
const RELOAD_MS = __RELOAD_MS__;
if (RELOAD_MS){
  const KEY = "knoten:seat";
  try {
    const seat = JSON.parse(sessionStorage.getItem(KEY) || "null");
    if (seat){
      // The fold first: a rule you had opened is where the node you were reading lives,
      // and restoring the selection before the fold would select a hidden card.
      (seat.open || []).forEach(id => { if (byId[id]) open.add(id); });
      if (seat.fold === false) setFold(false); else place();
      if (seat.clusters) setClusters(true);
      if (seat.mode === "map") setView("map");
      if (seat.sel && byId[seat.sel]) select(seat.sel);
      // After select/setView, which both reset things. A map that jumps back to the
      // origin — or a record that jumps back to its first line — every two seconds is
      // worse than no refresh at all.
      view = seat.pan; apply();
      panel.scrollTop = seat.read || 0;
    }
  } catch (e) { sessionStorage.removeItem(KEY); }
  addEventListener("beforeunload", () => sessionStorage.setItem(KEY,
    JSON.stringify({mode: VIEW, sel, pan: view, read: panel.scrollTop,
                    fold: FOLD, open: [...open], clusters: CLUSTERS})));

  // Do not reload out from under someone who is reading. The pointer resting on the
  // record is the clearest signal there is; the redraw waits its turn.
  let reading = false;
  panel.addEventListener("mouseenter", () => reading = true);
  panel.addEventListener("mouseleave", () => reading = false);
  (function tick(){ setTimeout(() => reading ? tick() : location.reload(), RELOAD_MS); })();

  // The badge has to be able to say NO. A watcher that died leaves the page reloading a
  // frozen file for ever, and a green "live" on stale data is worse than no badge.
  const BUILT_AT = __BUILT_AT__ * 1000;
  const stale = Date.now() - BUILT_AT > Math.max(4 * RELOAD_MS, 30000);
  const live = el("span", "live" + (stale ? " stale" : ""),
    stale ? `stale — last built ${new Date(BUILT_AT).toLocaleTimeString()}` : "live");
  live.title = stale ? "the --watch process is not running; this page is not updating" : "";
  // After the last of the header's switches. `header .viewsw` is now the view switch
  // alone, which put the badge in the middle of the controls.
  document.getElementById("clusters").after(live);
}
/*__WATCH__*/
</script>
